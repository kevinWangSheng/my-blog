<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">传统 compaction 与 Astra Codex 上下文管理对比</title>
  <desc id="desc">左侧显示多个上下文窗口反复压缩成单一摘要，若没有外部记录，被裁掉的细节无法从摘要直接恢复。右侧显示多个窗口留下 notes，同时由可搜索历史连接，当前窗口可以搜索旧消息和工具输出。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faf7"/>
      <stop offset="1" stop-color="#edf2ee"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c6b55"/>
      <stop offset="1" stop-color="#2d8870"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8b5a3c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c6b55"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203028" flood-opacity=".10"/>
    </filter>
    <style>
      .label { font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
      .head { font: 700 27px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #18241f; }
      .body { font: 500 16px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #4f5e56; }
      .small { font: 500 14px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #66756d; }
      .mono { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#paper)"/>
  <path d="M600 62 V618" stroke="#cfd8d1" stroke-width="2" stroke-dasharray="5 9"/>

  <text x="54" y="58" class="label" fill="#9b5b3d">传统 compaction</text>
  <text x="54" y="99" class="head">历史逐次压成一份摘要</text>
  <text x="54" y="130" class="body">一次省略会延续到后面的摘要</text>

  <g filter="url(#shadow)">
    <rect x="54" y="176" width="142" height="88" rx="12" fill="#ffffff" stroke="#cbd4ce"/>
    <rect x="224" y="176" width="142" height="88" rx="12" fill="#ffffff" stroke="#cbd4ce"/>
    <rect x="394" y="176" width="142" height="88" rx="12" fill="#ffffff" stroke="#cbd4ce"/>
  </g>
  <text x="80" y="211" class="mono" fill="#31594a">窗口 A</text>
  <text x="80" y="237" class="small">需求 + 日志</text>
  <text x="250" y="211" class="mono" fill="#31594a">窗口 B</text>
  <text x="250" y="237" class="small">调查 + 失败</text>
  <text x="420" y="211" class="mono" fill="#31594a">窗口 C</text>
  <text x="420" y="237" class="small">修改 + 测试</text>
  <path d="M196 220 H218" stroke="#8b5a3c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M366 220 H388" stroke="#8b5a3c" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="120" y="330" width="350" height="112" rx="16" fill="#fff8f1" stroke="#c98b68" stroke-width="2"/>
  <text x="151" y="369" class="mono" fill="#8b4d31">summary_v3</text>
  <text x="151" y="399" class="body">“注意兼容性，继续迁移”</text>
  <text x="151" y="424" class="small">原始失败原因已经不在当前材料里</text>
  <path d="M294 266 V322" stroke="#8b5a3c" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="120" y="504" width="350" height="96" rx="16" fill="#f4ded2" stroke="#b76542"/>
  <text x="151" y="543" class="head" font-size="22">无法直接回查</text>
  <text x="151" y="572" class="body">若无外部记录，遗漏细节要重新调查</text>
  <path d="M294 444 V496" stroke="#8b5a3c" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="654" y="58" class="label" fill="#1c6b55">Astra + Codex experimental</text>
  <text x="654" y="99" class="head">Notes 保存状态，旧窗口保持可搜索</text>
  <text x="654" y="130" class="body">摘要遗漏以后，仍可搜索原始消息和工具输出</text>

  <g filter="url(#shadow)">
    <rect x="654" y="176" width="142" height="88" rx="12" fill="#ffffff" stroke="#a8c3b7"/>
    <rect x="824" y="176" width="142" height="88" rx="12" fill="#ffffff" stroke="#a8c3b7"/>
    <rect x="994" y="176" width="142" height="88" rx="12" fill="#ffffff" stroke="#a8c3b7"/>
  </g>
  <text x="680" y="211" class="mono" fill="#1c6b55">窗口 A</text>
  <text x="680" y="237" class="small">需求 + 日志</text>
  <text x="850" y="211" class="mono" fill="#1c6b55">窗口 B</text>
  <text x="850" y="237" class="small">调查 + 失败</text>
  <text x="1020" y="211" class="mono" fill="#1c6b55">窗口 C</text>
  <text x="1020" y="237" class="small">修改 + 测试</text>

  <path d="M725 264 C725 300 725 300 725 327" stroke="#1c6b55" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M895 264 C895 300 895 300 895 327" stroke="#1c6b55" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M1065 264 C1065 300 1065 300 1065 327" stroke="#1c6b55" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <rect x="654" y="338" width="482" height="96" rx="16" fill="#e5f1ec" stroke="#63a78c" stroke-width="2"/>
  <text x="682" y="375" class="mono" fill="#1c6b55">notes</text>
  <text x="682" y="405" class="body">目标、状态、失败方案、待验证风险</text>

  <path d="M680 492 C770 446 1018 446 1110 492" fill="none" stroke="#315e88" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="654" y="494" width="482" height="106" rx="16" fill="#e8eef5" stroke="#668bad"/>
  <text x="682" y="533" class="mono" fill="#315e88">searchable history</text>
  <text x="682" y="563" class="body">按需回查早期要求、测试结果与工具输出</text>
  <text x="682" y="586" class="small">召回策略、保存期限和跨会话边界仍未公开</text>

  <rect x="966" y="620" width="170" height="34" rx="17" fill="url(#green)"/>
  <text x="1051" y="642" text-anchor="middle" class="mono" fill="#ffffff">可搜索，不等于必召回</text>
</svg>
